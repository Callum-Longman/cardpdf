<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spell Card Printer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Georgia, serif; background: #2b2b2b; color: #eee; display: flex; flex-direction: column; height: 100vh; }

  #toolbar {
    background: #1e1e1e;
    border-bottom: 1px solid #444;
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    align-items: center;
    flex-shrink: 0;
  }
  #toolbar label { font-size: 13px; }
  #toolbar select, #toolbar input[type="text"] {
    background: #333; color: #eee; border: 1px solid #555;
    padding: 3px 6px; border-radius: 4px; font-size: 13px;
  }
  .radio-group { display: flex; gap: 6px; align-items: center; }
  .radio-group label { cursor: pointer; }

  #action-bar {
    background: #1a1a1a;
    padding: 6px 12px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    border-bottom: 1px solid #444;
  }
  #action-bar button {
    padding: 4px 12px; border-radius: 4px; border: none; cursor: pointer;
    font-size: 13px; background: #444; color: #eee;
  }
  #action-bar button:hover { background: #555; }
  #status { margin-left: auto; font-size: 13px; color: #aaa; }

  #spell-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px;
    background: #262626;
  }
  .spell-item {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 4px; border-radius: 3px; cursor: pointer;
    font-size: 13px;
  }
  .spell-item:hover { background: #333; }
  .spell-item input[type="checkbox"] { cursor: pointer; accent-color: #2a7a45; }

  #generate-btn {
    background: #2a7a45; color: white; border: none;
    padding: 10px; font-size: 15px; font-weight: bold;
    cursor: pointer; flex-shrink: 0; letter-spacing: .3px;
  }
  #generate-btn:hover { background: #236638; }

  /* ── Card CSS (mirrors renderer.py CSS) ─────────────────────────── */
  #card-output { display: none; }

  /* ── Add Spell Modal ─────────────────────────────────────────────── */
  #modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 100;
    align-items: center; justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: #1e1e1e; border: 1px solid #555; border-radius: 8px;
    padding: 20px 24px; width: 520px; max-height: 90vh; overflow-y: auto;
    color: #eee; font-size: 13px;
  }
  #modal h2 { margin-bottom: 14px; font-size: 16px; color: #ccc; }
  .form-row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
  .form-row label { font-size: 12px; color: #aaa; }
  .form-row input, .form-row select, .form-row textarea {
    background: #2b2b2b; color: #eee; border: 1px solid #555;
    padding: 5px 8px; border-radius: 4px; font-size: 13px; font-family: Georgia, serif;
  }
  .form-row textarea { resize: vertical; min-height: 70px; }
  .form-row-inline { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; }
  .form-row-inline label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .modal-btns button {
    padding: 6px 16px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px;
  }
  #modal-save { background: #2a7a45; color: white; }
  #modal-save:hover { background: #236638; }
  #modal-cancel { background: #444; color: #eee; }
  #modal-cancel:hover { background: #555; }
  #modal-download { background: #3a5f8a; color: white; }
  #modal-download:hover { background: #2e4d72; }
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <div style="display:flex;align-items:center;gap:6px">
    <label>Source:</label>
    <div class="radio-group">
      <input type="radio" name="source" id="src-all" value="All" checked><label for="src-all">All</label>
      <input type="radio" name="source" id="src-2014" value="2014"><label for="src-2014">2014</label>
      <input type="radio" name="source" id="src-2024" value="2024"><label for="src-2024">2024</label>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:6px">
    <label for="lvl-sel">Level:</label>
    <select id="lvl-sel"><option>All</option><option>Cantrip</option></select>
  </div>

  <div style="display:flex;align-items:center;gap:6px">
    <label for="school-sel">School:</label>
    <select id="school-sel"><option>All</option></select>
  </div>

  <div style="display:flex;align-items:center;gap:6px">
    <label for="class-sel">Class:</label>
    <select id="class-sel"><option>All</option></select>
  </div>

  <div style="display:flex;align-items:center;gap:6px">
    <label for="search-box">Search:</label>
    <input type="text" id="search-box" placeholder="Spell name…" style="width:180px">
  </div>

  <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
    <label for="border-file" style="cursor:pointer;background:#444;padding:4px 10px;border-radius:4px;font-size:13px">
      Border Image…
    </label>
    <input type="file" id="border-file" accept="image/*" style="display:none">
    <span id="border-name" style="font-size:12px;color:#888;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  </div>
</div>

<!-- Action bar -->
<div id="action-bar">
  <button id="btn-all">Select All</button>
  <button id="btn-none">Select None</button>
  <button id="btn-add-spell" style="background:#2a4a7a;color:#eee">+ Add Spell</button>
  <span id="status">Loading…</span>
</div>

<!-- Spell list -->
<div id="spell-list"></div>

<!-- Generate button -->
<button id="generate-btn">Generate &amp; Open Cards ▶</button>

<!-- Add Spell Modal -->
<div id="modal-overlay">
  <div id="modal">
    <h2>Add Custom Spell (2024 Format)</h2>
    <div class="form-row"><label>Name *</label><input type="text" id="f-name" placeholder="e.g. Fireball"></div>
    <div style="display:flex;gap:12px">
      <div class="form-row" style="flex:1"><label>Level (0=Cantrip)</label>
        <select id="f-level">
          <option value="0">0 – Cantrip</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option><option value="9">9</option>
        </select>
      </div>
      <div class="form-row" style="flex:1"><label>School</label>
        <select id="f-school">
          <option>abjuration</option><option>conjuration</option><option>divination</option>
          <option>enchantment</option><option>evocation</option><option>illusion</option>
          <option>necromancy</option><option>transmutation</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:12px">
      <div class="form-row" style="flex:1"><label>Action Type</label><input type="text" id="f-action" placeholder="e.g. Action, Bonus Action"></div>
      <div class="form-row" style="flex:1"><label>Range</label><input type="text" id="f-range" placeholder="e.g. 150 feet"></div>
    </div>
    <div style="display:flex;gap:12px">
      <div class="form-row" style="flex:1"><label>Duration</label><input type="text" id="f-duration" placeholder="e.g. Instantaneous"></div>
      <div class="form-row" style="flex:1"><label>Components (comma-separated)</label><input type="text" id="f-components" placeholder="e.g. V, S, M"></div>
    </div>
    <div class="form-row"><label>Material (if any)</label><input type="text" id="f-material" placeholder="e.g. a tiny ball of bat guano"></div>
    <div class="form-row-inline">
      <label><input type="checkbox" id="f-concentration"> Concentration</label>
      <label><input type="checkbox" id="f-ritual"> Ritual</label>
    </div>
    <div class="form-row"><label>Classes (comma-separated)</label><input type="text" id="f-classes" placeholder="e.g. Wizard, Sorcerer"></div>
    <div class="form-row"><label>Description *</label><textarea id="f-description" placeholder="Spell description…"></textarea></div>
    <div class="form-row"><label>Cantrip Upgrade / At Higher Levels</label><textarea id="f-upgrade" style="min-height:45px" placeholder="Optional upgrade text…"></textarea></div>
    <div class="modal-btns">
      <button id="modal-download" title="Download updated spells2024.json">⬇ Export JSON</button>
      <button id="modal-cancel">Cancel</button>
      <button id="modal-save">Add Spell</button>
    </div>
  </div>
</div>

<script>
// ── Data ───────────────────────────────────────────────────────────────────
let allSpells = [];    // [{spell, year}]
let filtered  = [];
const checked = new Map();  // key → bool
let borderDataUrl = "";

function key(spell, year) { return `${year}::${spell.name}`; }

async function loadJSON(file, year) {
  try {
    const r = await fetch(file);
    if (!r.ok) return;
    const data = await r.json();
    for (const spell of data) allSpells.push({ spell, year });
  } catch(e) { console.warn("Could not load", file, e); }
}

async function init() {
  await Promise.all([loadJSON("spells2014.json","2014"), loadJSON("spells2024.json","2024")]);
  populateDropdowns();
  applyFilter();
}

function populateDropdowns() {
  const schools = new Set(), classes = new Set();
  for (const {spell} of allSpells) {
    if (spell.school) schools.add(capitalize(spell.school));
    for (const c of (spell.classes||[])) classes.add(capitalize(c));
  }
  fillSelect("school-sel", [...schools].sort());
  fillSelect("class-sel", [...classes].sort());
  const lvlSel = document.getElementById("lvl-sel");
  for (let i=1;i<=9;i++) { const o=document.createElement("option"); o.textContent=String(i); lvlSel.add(o); }
}

function fillSelect(id, values) {
  const el = document.getElementById(id);
  for (const v of values) { const o=document.createElement("option"); o.textContent=v; el.add(o); }
}

// ── Filter ────────────────────────────────────────────────────────────────
function applyFilter() {
  const source = document.querySelector('input[name="source"]:checked').value;
  const lvl    = document.getElementById("lvl-sel").value.toLowerCase();
  const school = document.getElementById("school-sel").value.toLowerCase();
  const cls    = document.getElementById("class-sel").value.toLowerCase();
  const q      = document.getElementById("search-box").value.toLowerCase();

  filtered = allSpells.filter(({spell, year}) => {
    if (source !== "All" && year !== source) return false;
    if (lvl !== "all") {
      const lk = lvlKey(spell, year);
      if (lk !== lvl) return false;
    }
    if (school !== "all" && (spell.school||"").toLowerCase() !== school) return false;
    if (cls !== "all" && !(spell.classes||[]).map(c=>c.toLowerCase()).includes(cls)) return false;
    if (q && !(spell.name||"").toLowerCase().includes(q)) return false;
    return true;
  });

  renderList();
}

function lvlKey(spell, year) {
  if (year === "2014") {
    const lv = (spell.level||"").toString().toLowerCase();
    return lv === "cantrip" ? "cantrip" : lv;
  }
  const lv = spell.level ?? 0;
  return lv === 0 ? "cantrip" : String(lv);
}

// ── Render list ───────────────────────────────────────────────────────────
function renderList() {
  const container = document.getElementById("spell-list");
  container.innerHTML = "";
  for (const {spell, year} of filtered) {
    const k   = key(spell, year);
    if (!checked.has(k)) checked.set(k, false);
    const lk  = capitalize(lvlKey(spell, year));
    const sch = capitalize(spell.school||"");
    const label = `[${year}]  ${spell.name}   ${lk} · ${sch}`;

    const div  = document.createElement("div");
    div.className = "spell-item";
    const cb   = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = checked.get(k);
    cb.addEventListener("change", () => { checked.set(k, cb.checked); updateStatus(); });
    const lbl  = document.createElement("label");
    lbl.textContent = label;
    lbl.style.cursor = "pointer";
    lbl.addEventListener("click", () => { cb.checked = !cb.checked; checked.set(k, cb.checked); updateStatus(); });
    div.append(cb, lbl);
    container.appendChild(div);
  }
  updateStatus();
}

function updateStatus() {
  let n = 0;
  for (const v of checked.values()) if (v) n++;
  const el = document.getElementById("status");
  if (n === 0) { el.textContent = "0 selected"; return; }
  const pages = Math.ceil(n/9);
  el.textContent = `${n} selected · ${pages} page${pages!==1?"s":""}`;
}

// ── Select all / none ────────────────────────────────────────────────────
document.getElementById("btn-all").addEventListener("click", () => {
  for (const {spell,year} of filtered) checked.set(key(spell,year), true);
  renderList();
});
document.getElementById("btn-none").addEventListener("click", () => {
  for (const {spell,year} of filtered) checked.set(key(spell,year), false);
  renderList();
});

// ── Add Spell Modal ───────────────────────────────────────────────────────
const overlay = document.getElementById("modal-overlay");
document.getElementById("btn-add-spell").addEventListener("click", () => {
  overlay.classList.add("open");
});
document.getElementById("modal-cancel").addEventListener("click", () => {
  overlay.classList.remove("open");
});
overlay.addEventListener("click", e => { if (e.target === overlay) overlay.classList.remove("open"); });

document.getElementById("modal-save").addEventListener("click", () => {
  const name = document.getElementById("f-name").value.trim();
  const desc = document.getElementById("f-description").value.trim();
  if (!name) { alert("Spell name is required."); return; }
  if (!desc)  { alert("Description is required."); return; }

  const compRaw = document.getElementById("f-components").value.trim();
  const components = compRaw ? compRaw.split(",").map(c=>c.trim().toUpperCase()).filter(Boolean) : [];
  const classRaw = document.getElementById("f-classes").value.trim();
  const classes = classRaw ? classRaw.split(",").map(c=>c.trim()).filter(Boolean) : [];

  const spell = {
    name,
    level: parseInt(document.getElementById("f-level").value),
    school: document.getElementById("f-school").value,
    actionType: document.getElementById("f-action").value.trim(),
    range: document.getElementById("f-range").value.trim(),
    duration: document.getElementById("f-duration").value.trim(),
    components,
    material: document.getElementById("f-material").value.trim(),
    concentration: document.getElementById("f-concentration").checked,
    ritual: document.getElementById("f-ritual").checked,
    classes,
    description: desc,
    cantripUpgrade: document.getElementById("f-upgrade").value.trim(),
  };

  allSpells.push({ spell, year: "2024" });
  checked.set(key(spell, "2024"), true);
  populateDropdowns();
  applyFilter();
  overlay.classList.remove("open");
  // clear form
  ["f-name","f-action","f-range","f-duration","f-components","f-material","f-classes","f-description","f-upgrade"]
    .forEach(id => document.getElementById(id).value = "");
  document.getElementById("f-concentration").checked = false;
  document.getElementById("f-ritual").checked = false;
  document.getElementById("f-level").value = "0";
});

document.getElementById("modal-download").addEventListener("click", () => {
  const spells2024 = allSpells.filter(e => e.year === "2024").map(e => e.spell);
  const blob = new Blob([JSON.stringify(spells2024, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "spells2024.json";
  a.click();
});

// ── Border image ──────────────────────────────────────────────────────────
document.getElementById("border-file").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;
  document.getElementById("border-name").textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => { borderDataUrl = e.target.result; };
  reader.readAsDataURL(file);
});

// ── Filters wiring ────────────────────────────────────────────────────────
document.querySelectorAll('input[name="source"]').forEach(r => r.addEventListener("change", applyFilter));
["lvl-sel","school-sel","class-sel"].forEach(id => document.getElementById(id).addEventListener("change", applyFilter));
document.getElementById("search-box").addEventListener("input", applyFilter);

// ── Generate ──────────────────────────────────────────────────────────────
document.getElementById("generate-btn").addEventListener("click", () => {
  const selected = [];
  for (const {spell, year} of allSpells) {
    if (checked.get(key(spell, year))) selected.push({spell, year});
  }
  if (!selected.length) { alert("Select at least one spell first."); return; }
  const html = buildHTML(selected, borderDataUrl);
  const blob = new Blob([html], {type:"text/html"});
  const url  = URL.createObjectURL(blob);
  window.open(url, "_blank");
});

// ── Renderer (mirrors renderer.py) ───────────────────────────────────────
function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function toHTML(text) {
  let s = esc(text);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return s.replace(/\n\n/g,"<br><br>").replace(/\n/g,"<br>");
}

function normaliseSpell(spell, edition) {
  if (edition === "2014") {
    return {
      name: spell.name||"",
      type: spell.type||"",
      level: null,
      school: null,
      action: spell.casting_time||"",
      concentration: false,
      ritual: spell.ritual||false,
      range: spell.range||"",
      duration: spell.duration||"",
      components: (spell.components||{}).raw||"",
      description: spell.description||"",
      extra_text: spell.higher_levels||"",
      extra_label: "At Higher Levels",
    };
  }
  // 2024
  const comps   = spell.components||[];
  const material= spell.material||"";
  let comp_str  = comps.map(c=>c.toUpperCase()).join(", ");
  if (material) comp_str += ` (${material})`;
  const level   = spell.level??0;
  return {
    name: spell.name||"",
    type: `${level===0?"Cantrip":`Level ${level}`} · ${capitalize(spell.school||"")}`,
    level,
    school: spell.school||"",
    action: spell.actionType||"",
    concentration: spell.concentration||false,
    ritual: spell.ritual||false,
    range: spell.range||"",
    duration: spell.duration||"",
    components: comp_str,
    description: spell.description||"",
    extra_text: spell.cantripUpgrade||"",
    extra_label: "Upgrade",
  };
}

function renderCard(n, borderDataUrl) {
  const badges = (n.concentration ? '<span class="badge">Conc.</span>' : "")
               + (n.ritual        ? '<span class="badge">Ritual</span>' : "");
  const extraHTML = n.extra_text
    ? `<div class="extra"><em>${esc(n.extra_label)}:</em> ${esc(n.extra_text)}</div>`
    : "";
  const borderStyle = borderDataUrl
    ? `style="background-image:url(${borderDataUrl})"` : "";
  return `<div class="card" ${borderStyle}>`
    + `<div class="card-content">`
    + `<div class="hdr"><span class="name">${esc(n.name)}</span>${badges}</div>`
    + `<div class="sub">${esc(n.type)}</div>`
    + `<div class="meta">`
    + `<span><b>Action:</b> ${esc(n.action)}</span><span><b>Range:</b> ${esc(n.range)}</span>`
    + `<span><b>Duration:</b> ${esc(n.duration)}</span><span><b>Components:</b> ${esc(n.components)}</span>`
    + `</div>`
    + `<div class="desc">${toHTML(n.description)}</div>${extraHTML}`
    + `</div></div>`;
}

const CARD_CSS = `
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: #bbb; }
@media print {
  @page { size: A4; margin: 8mm; }
  body { background: white; }
  .page { box-shadow: none !important; margin: 0 !important; width: 194mm; height: 281mm; padding: 0; page-break-after: always; }
  .page:last-child { page-break-after: avoid; }
}
.page { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2mm; width: 210mm; height: 297mm; padding: 8mm; margin: 14px auto; background: white; box-shadow: 0 2px 12px rgba(0,0,0,.35); }
.card { border: none; border-radius: 0; padding: 0; background-size: 100% 100%; background-position: 0 0; background-repeat: no-repeat; display: flex; flex-direction: column; gap: 1mm; overflow: hidden; }
.card-content { padding: 6mm; flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 1mm; }
.card-empty { border: 0.5pt dashed #bbb; }
.hdr { display: flex; justify-content: space-between; align-items: flex-start; gap: 1mm; border-bottom: 0.5pt solid #555; padding-bottom: 1mm; }
.name { font-size: 7.5pt; font-weight: bold; line-height: 1.2; }
.badge { font-size: 5pt; background: #333; color: #fff; padding: .4mm 1mm; border-radius: 1pt; white-space: nowrap; flex-shrink: 0; align-self: center; }
.sub { font-size: 5.5pt; font-style: italic; color: #555; }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: .3mm 2mm; font-size: 6pt; }
.desc { font-size: 5.5pt; line-height: 1.35; flex: 1; overflow: hidden; }
.extra { font-size: 5.5pt; font-style: italic; color: #444; border-top: .5pt solid #ccc; padding-top: 1mm; overflow: hidden; }
`;

function buildHTML(selected, borderDataUrl) {
  const pages = [];
  for (let i=0; i<selected.length; i+=9) pages.push(selected.slice(i,i+9));
  let body = "";
  for (const page of pages) {
    let cards = page.map(({spell,year}) => renderCard(normaliseSpell(spell,year), borderDataUrl)).join("");
    cards += '<div class="card card-empty"></div>'.repeat(9 - page.length);
    body += `<div class="page">${cards}</div>\n`;
  }
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spell Cards</title>`
    + `<style>${CARD_CSS}</style></head><body>${body}</body></html>`;
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }

// ── Boot ──────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
